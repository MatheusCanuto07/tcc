<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="640" viewBox="0 0 520 640">
  <style>
    .box { fill: #ffffff; stroke: #111111; stroke-width: 1.8; }
    .label { font-family: "Times New Roman", Times, serif; font-size: 15px; fill: #111111; }
    .arrow { stroke: #111111; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#111111"/>
    </marker>
  </defs>

  <!-- boxes -->
  <rect class="box" x="60" y="20" width="400" height="44" rx="4"/>
  <text class="label" x="260" y="47" text-anchor="middle">1. Definir recorte CNAE de TI</text>

  <rect class="box" x="60" y="95" width="400" height="44" rx="4"/>
  <text class="label" x="260" y="122" text-anchor="middle">2. Extrair CNPJ de Contagem (ativos + CNAE)</text>

  <rect class="box" x="60" y="170" width="400" height="44" rx="4"/>
  <text class="label" x="260" y="197" text-anchor="middle">3. Integrar razão social, porte e capital social</text>

  <rect class="box" x="60" y="245" width="400" height="44" rx="4"/>
  <text class="label" x="260" y="272" text-anchor="middle">4. Obter coordenadas via CNEFE</text>

  <rect class="box" x="60" y="320" width="400" height="44" rx="4"/>
  <text class="label" x="260" y="347" text-anchor="middle">5. Associar malhas territoriais do IBGE</text>

  <rect class="box" x="60" y="395" width="400" height="44" rx="4"/>
  <text class="label" x="260" y="422" text-anchor="middle">6. Conferir totais no CEMPRE/SIDRA</text>

  <rect class="box" x="60" y="470" width="400" height="44" rx="4"/>
  <text class="label" x="260" y="497" text-anchor="middle">7. Desenvolver aplicação web interativa</text>

  <rect class="box" x="60" y="545" width="400" height="44" rx="4"/>
  <text class="label" x="260" y="572" text-anchor="middle">8. Analisar distribuição e apresentar resultados</text>

  <!-- arrows -->
  <line class="arrow" x1="260" y1="64" x2="260" y2="93"/>
  <line class="arrow" x1="260" y1="139" x2="260" y2="168"/>
  <line class="arrow" x1="260" y1="214" x2="260" y2="243"/>
  <line class="arrow" x1="260" y1="289" x2="260" y2="318"/>
  <line class="arrow" x1="260" y1="364" x2="260" y2="393"/>
  <line class="arrow" x1="260" y1="439" x2="260" y2="468"/>
  <line class="arrow" x1="260" y1="514" x2="260" y2="543"/>
</svg>
